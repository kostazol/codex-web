# Loaded in the existing nginx http context. Separate internal listeners keep
# local-v2/local-v3 private while all Windows-facing URLs still use port 443.
log_format codex_web '$time_iso8601 $remote_addr $status $request_method $uri '
                     'request=$request_time upstream_connect=$upstream_connect_time '
                     'upstream_response=$upstream_response_time';
map $http_upgrade $codex_web_connection_upgrade {
    default upgrade;
    '' '';
}
map $http_origin $codex_web_origin_allowed {
    default 0;
    '' 1;
    'https://web-codex.duckdns.org' 1;
}
upstream codex_web {
    server host.docker.internal:8214;
    # Desktop imports hundreds of modules. Reuse Windows/Docker connections
    # instead of creating a new TCP connection for each module on a cold load.
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 30s;
}

server {
    listen 8444 ssl default_server;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 8444 ssl;
    listen 443 ssl;
    server_name web-codex.duckdns.org;
    http2 on;
    http2_max_concurrent_streams 32;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_session_cache shared:CodexWebTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 32m;
    # Query strings can contain credentials; keep them out of access logs.
    access_log /dev/stdout codex_web;

    allow 127.0.0.1;
    allow 172.18.0.1;
    allow 10.250.2.0/24;
    allow 192.168.5.0/24;
    allow 192.168.1.0/24;
    allow 10.20.0.1;
    allow 10.20.0.2;
    deny all;

    if ($host != web-codex.duckdns.org) { return 421; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codex_web_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location = /__backend/ipc {
        if ($codex_web_origin_allowed = 0) { return 403; }
        proxy_pass http://codex_web;
    }
    location = /pwa-version.json {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://codex_web;
    }
    location = /pwa-assets.json {
        gzip on;
        gzip_vary on;
        gzip_types application/json;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        proxy_buffering on;
        proxy_pass http://codex_web;
    }
    location = /pwa-worker.js {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://codex_web;
    }
    location /__pwa/ {
        # Versioned metadata and content-addressed public UI, including old
        # lazy chunks needed by open pages after an update.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/wasm;
        proxy_buffering on;
        proxy_pass http://codex_web;
    }
    location /assets/ {
        # Only static UI assets are compressed/buffered. IPC remains streaming.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_types application/javascript text/javascript text/css image/svg+xml application/wasm;
        proxy_buffering on;
        proxy_pass http://codex_web;
    }
    location / {
        proxy_pass http://codex_web;
    }
}
